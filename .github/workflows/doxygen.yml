name: Deploy Doxygen Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        
      - name: Sparse Checkout Linux Kernel Source (v7.0)
        run: |
          mkdir -p src
          cd src
          git init
          git remote add origin https://github.com/torvalds/linux.git
          git config core.sparseCheckout true
          git sparse-checkout set kernel include/linux include/uapi mm arch/x86/include
          git fetch --filter=blob:none --depth=1 origin tag v7.0
          git checkout FETCH_HEAD
          cd ..
          
      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen Documentation
        run: |
          chmod +x ./doxygen_kernel_filter.sh
          rm -rf html/
          doxygen Doxyfile

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
